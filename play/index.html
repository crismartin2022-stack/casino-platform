<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d17" />
  <!-- Añadido a la pantalla de inicio (iPhone/Android) el juego abre a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Slots</title>
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.mjs",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
    }
  }
  </script>
  <style>
    :root { --primary:#e94560; --accent:#ffd460; --panel:#16213e; --text:#fff; --font: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d17; color: var(--text); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }

    /* ---- Fondo: imagen distinta para PC (horizontal) y celular (vertical) ---- */
    #bg { position: fixed; inset: 0; background-color: var(--bg-color, #05060c); background-size: cover; background-position: center;
      background-image: var(--bg-desktop, radial-gradient(ellipse at center, color-mix(in srgb, var(--primary) 25%, #000) 0%, #05060c 75%)); }
    @media (orientation: portrait) { #bg { background-image: var(--bg-mobile, var(--bg-desktop, radial-gradient(ellipse at center, color-mix(in srgb, var(--primary) 25%, #000) 0%, #05060c 75%))); } }
    #bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }

    #stage { position: fixed; inset: 0; }
    #stage canvas { position: relative; z-index: 1; }
    #stage .reelsbg { z-index: 0; }
    #bg video.bgvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--font); color: var(--text);
      --btn: rgba(255,255,255,.12); --btn-text: var(--text); --btn-scale: 1; --bar: rgba(10,8,12,.82); --bar-border: color-mix(in srgb, var(--accent) 65%, transparent);
      --spin-size: 84px; --ui: 1; --gx: 50vw; --gb: 80vh; --gw: 900px; }
    #hud > * { pointer-events: auto; }
    #hud .top, #hud .status, #hud .banner { pointer-events: none; }
    #hud .top > * { pointer-events: auto; }
    .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 14px 8px; }
    .top a { position: absolute; left: 14px; }
    .top .tr { position: absolute; right: 14px; display: flex; gap: 8px; }
    .top .tr .chip { background: rgba(0,0,0,.45); }
    #hud[data-orient="portrait"]:not([data-skin]) .top .tr { right: 62px; }
    .tag { background: #ff9f1c; color: #000; font: 700 11px system-ui; padding: 4px 8px; border-radius: 6px; }
    .forcebtn { background: linear-gradient(#b14cff, #6a1fd1); color: #fff; font: 800 11px system-ui; letter-spacing: .06em; padding: 6px 10px; border-radius: 8px; box-shadow: 0 0 0 2px #fff4, 0 4px 12px rgba(0,0,0,.5); white-space: nowrap; }
    #hud[data-orient="portrait"] .forcebtn { font-size: 9px; padding: 4px 6px; }
    /* En celular la etiqueta de vista previa y FORZAR BONUS bajan una fila para no quedar debajo de los botones de las esquinas */
    #hud[data-orient="portrait"] .top > .tag, #hud[data-orient="portrait"] .top > .forcebtn { transform: translateY(54px); }
    button { font-family: inherit; cursor: pointer; border: 0; color: inherit; -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .stat { display: flex; flex-direction: column; align-items: center; min-width: 0; line-height: 1.15; }
    .stat small { font: 600 10px system-ui; opacity: .75; letter-spacing: .12em; }
    .stat b { font-size: calc(15px * var(--ui)); white-space: nowrap; }
    .stat.flash b { color: var(--accent); text-shadow: 0 0 12px var(--accent); transition: color .2s; }

    .chip { width: 38px; height: 38px; border-radius: 50%; background: var(--btn); color: var(--btn-text); font-size: 17px; display: grid; place-items: center; text-decoration: none; flex: none; transition: transform .1s; }
    .chip:active { transform: scale(.9); }
    .chip.on { background: var(--accent); color: #000; }
    .autos .chip { width: auto; min-width: 38px; padding: 0 12px; border-radius: 999px; font: 700 12px system-ui; border: 1px solid var(--bar-border); background: rgba(0,0,0,.35); }
    .betbox { display: flex; align-items: center; gap: 8px; }
    .betbtns { display: flex; gap: 6px; }
    .chip.maxbet:not(.img) { width: auto; min-width: 44px; padding: 0 10px; border-radius: 999px; font: 800 11px system-ui; letter-spacing: .06em; border: 1px solid var(--bar-border); }
    .spin { width: var(--spin-size); height: var(--spin-size); border-radius: 50%; flex: none; font-size: calc(var(--spin-size) * .45);
      background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--primary) 55%, #fff), var(--primary) 58%, color-mix(in srgb, var(--primary) 55%, #000));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 80%, transparent), 0 0 24px color-mix(in srgb, var(--primary) 70%, transparent), 0 8px 20px rgba(0,0,0,.6);
      transition: transform .1s; }
    .spin:active { transform: scale(.93); }
    .spin.busy span { display: inline-block; animation: rot .5s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* ---- Botonera PC: píldora centrada bajo los rodillos; GIRAR sobresale ---- */
    .bar { position: absolute; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      left: var(--gx); top: calc(var(--gb) + 22px * var(--ui)); transform: translateX(-50%);
      width: min(96vw, max(620px, calc(var(--gw) + 60px))); height: 58px; padding: 0 16px;
      background: var(--bar); border: 1.5px solid var(--bar-border); border-radius: 999px; backdrop-filter: blur(6px);
      box-shadow: 0 8px 26px rgba(0,0,0,.55); }
    .bar .spin { margin: -18px 0; }
    .buybox { position: absolute; left: calc(var(--gx) - var(--gw) / 2 - 12px); top: calc(var(--gy) + 12px); transform: translateX(-100%); }
    .buy { background: linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 60%, #000)); color: #000; font-weight: 800; padding: 12px 14px; border-radius: 14px; font-size: 13px; max-width: 120px; line-height: 1.1; box-shadow: 0 6px 18px rgba(0,0,0,.5); }

    /* Botonera clásica (theme.hud.layout = "classic"): barra de ancho completo abajo */
    #hud[data-layout="classic"] .bar { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; height: calc(80px + env(safe-area-inset-bottom));
      border-radius: 0; border-width: 2px 0 0; padding-bottom: env(safe-area-inset-bottom); }
    #hud[data-layout="classic"] .bar .spin { margin: 0; }

    /* ---- Celular (vertical): ☰ y 🔊 arriba en las esquinas; panel de 2 filas bajo los rodillos ---- */
    #hud[data-orient="portrait"] .bar { top: calc(var(--gb) + 14px); bottom: auto; left: 10px; right: 10px; transform: none; width: auto; height: auto;
      display: grid; grid-template-columns: 1fr auto 1fr; grid-template-areas: "saldo spin apuesta" "premio spin autos";
      row-gap: 10px; column-gap: 12px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border-radius: 22px; }
    /* backdrop-filter crearía un contenedor para los botones fijos (☰ y 🔊 deben ir arriba en las esquinas) */
    #hud[data-orient="portrait"] .bar { backdrop-filter: none; -webkit-backdrop-filter: none; }
    #hud[data-orient="portrait"][data-layout="classic"] .bar { top: auto; bottom: 0; left: 0; right: 0; border-radius: 22px 22px 0 0; }
    #hud[data-orient="portrait"] .bar .spin { grid-area: spin; margin: 0; --spin-size: 92px; }
    #hud[data-orient="portrait"] .saldo { grid-area: saldo; }
    #hud[data-orient="portrait"] .premio { grid-area: premio; }
    #hud[data-orient="portrait"] .betbox { grid-area: apuesta; flex-direction: column; gap: 4px; }
    #hud[data-orient="portrait"] .autos { grid-area: autos; display: flex; justify-content: center; gap: 6px; }
    #hud[data-orient="portrait"] .bar > .menu { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; }
    #hud[data-orient="portrait"] .bar > .chip:last-child { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; }
    #hud[data-orient="portrait"] .buybox { left: 50%; top: calc(var(--gy) - 12px); transform: translate(-50%, -100%); }
    #hud[data-orient="portrait"] .buy { max-width: none; padding: 8px 18px; }

    /* ---- Botones personalizables (theme.buttons) ---- */
    .chip { transform: scale(var(--btn-scale)); }
    #hud[data-shape="rounded"] .chip, #hud[data-shape="rounded"] .spin:not(.img) { border-radius: 12px; }
    #hud[data-shape="square"] .chip, #hud[data-shape="square"] .spin:not(.img) { border-radius: 4px; }
    #hud[data-shape="pill"] .chip { border-radius: 999px; width: auto; min-width: 48px; padding: 0 12px; }
    #hud[data-style="flat"] .spin:not(.img) { background: var(--primary); box-shadow: none; }
    #hud[data-style="flat"] .chip { background: color-mix(in srgb, var(--primary) 35%, var(--panel)); }
    #hud[data-style="glass"] .chip, #hud[data-style="glass"] .spin:not(.img) { background: rgba(255,255,255,.14); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.35); }
    #hud[data-style="outline"] .chip, #hud[data-style="outline"] .spin:not(.img) { background: transparent; border: 2px solid var(--accent); box-shadow: none; color: var(--accent); }
    .spin { transform: scale(var(--btn-scale)); }
    button.img { background: none !important; border: 0 !important; box-shadow: none !important; padding: 0; width: auto; height: auto; border-radius: 0; position: relative; }
    button.img img { display: block; height: 38px; width: auto; max-width: 140px; object-fit: contain; pointer-events: none; }
    .spin.img img { height: var(--spin-size); max-width: 200px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
    .buy.img img { height: 56px; max-width: 170px; }
    button.img:active img { transform: scale(.94); }
    .spin.img.busy img { animation: pulse .6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.92); filter: brightness(.8); } }
    button.img.on img { filter: drop-shadow(0 0 8px var(--accent)) brightness(1.2); }
    button.img.muted img { filter: grayscale(1) opacity(.6); }
    button.img .count { position: absolute; right: -6px; top: -6px; background: var(--accent); color: #000; font: 700 11px system-ui; padding: 1px 5px; border-radius: 99px; font-style: normal; }

    /* ---- Mensajes ---- */
    .banner { position: absolute; left: var(--gx); top: calc((var(--gy) + var(--gb)) / 2); transform: translate(-50%, -50%); text-align: center; padding: 16px 34px; border-radius: 22px;
      background: rgba(0,0,0,.74); border: 3px solid var(--accent); box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 50%, transparent); animation: pop .3s cubic-bezier(.2,1.6,.4,1); }
    .banner small { display: block; font-size: clamp(14px, 2.4vw, 24px); letter-spacing: .1em; color: var(--accent); }
    .banner b { display: block; font-size: clamp(30px, 6vw, 68px); }
    .banner.big b { color: var(--accent); text-shadow: 0 0 18px var(--primary); }
    .banner.big { animation: pop .3s cubic-bezier(.2,1.6,.4,1), glow 0.8s ease-in-out infinite alternate; }
    @keyframes pop { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } }
    @keyframes glow { to { box-shadow: 0 0 70px var(--accent); } }
    .status { position: absolute; left: var(--gx); top: calc(var(--gy) - 8px); transform: translate(-50%, -100%); background: rgba(0,0,0,.65); padding: 5px 14px; border-radius: 999px; font-size: clamp(12px, 1.6vw, 15px); white-space: nowrap; }
    .status:empty { display: none; }
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 16px; z-index: 10; }
    .modal[hidden], .banner[hidden] { display: none; }
    .sheet { position: relative; background: var(--panel); border: 2px solid var(--accent); border-radius: 18px; padding: 22px; max-width: 760px; width: 100%; max-height: 88vh; overflow: auto; font-family: system-ui, sans-serif; }
    .sheet h2 { font-family: var(--font); margin: 0 0 10px; color: var(--accent); }
    .sheet .close { position: absolute; top: 10px; right: 10px; }
    .info-bet { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
    .info-bet b { font-size: 20px; color: var(--accent); min-width: 90px; text-align: center; }
    .info-bet .chip { width: 38px; height: 38px; font-size: 20px; }
    .info-bet small { opacity: .7; }
    .info-bet > span { flex: 1 1 100%; }
    .info-extra { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; margin: 10px 0; }
    .info-extra div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.05); }
    .info-extra b { color: var(--accent); }
    .paytable .pl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px dotted rgba(255,255,255,.14); padding: 2px 0; }
    .paytable .pl span { opacity: .8; font-size: .92em; white-space: nowrap; }
    .paytable .pl b { color: var(--accent); white-space: nowrap; }
    .paytable { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 14px 0; }
    .pay { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px; font-size: 13px; }
    .pay img { width: 56px; height: 56px; object-fit: contain; }
    .pay > div:last-child { flex: 1; min-width: 0; }
    .fine { font-size: 11px; opacity: .7; }
    .choose { display: flex; flex-direction: column; gap: 10px; }
    .choose .option { display: flex; justify-content: space-between; align-items: center; gap: 16px; max-width: none; width: 100%; font-size: 15px; padding: 14px 18px; }
    .picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
    .picks button { aspect-ratio: 1; border-radius: 14px; font: 800 18px system-ui; background: linear-gradient(var(--primary), color-mix(in srgb, var(--primary) 50%, #000)); color: #fff; border: 2px solid var(--accent); }
    .picks button.revealed { background: var(--accent); color: #000; }
    .picks button.other { opacity: .45; background: #333; color: #ddd; border-color: #555; }
    .wheel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
    .wheel div { padding: 14px 6px; border-radius: 12px; background: rgba(255,255,255,.08); font: 800 16px system-ui; text-align: center; transition: background .08s; }
    .wheel div.hot { background: var(--accent); color: #000; }
    .confirm { text-align: center; } .confirm .buy { font-size: 16px; padding: 12px 22px; max-width: none; }
    .auto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 10px; margin: 10px 0 16px; }
    .auto-grid .auto-n { font-size: 22px; padding: 16px 0; }
    .auto-lbl { display: flex; flex-direction: column; gap: 6px; align-items: center; font-size: 13px; }
    .auto-loss { font: 600 14px system-ui; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.08); color: var(--text); border: 1px solid rgba(255,255,255,.25); }
    .auto-loss option { color: #000; }

    /* =====================================================================
       INTERFACES COMPLETAS (theme.hud.layout = neon | cristal | brasa | real | arcade)
       Estructura común + identidad propia de cada una. Colores desde la paleta del juego.
       ===================================================================== */
    #hud[data-skin] { --top-h: 62px; --dock-h: 112px; }
    #hud[data-skin] .sk-top { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--top-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 14px 0;
      display: flex; align-items: center; gap: 12px; z-index: 3; }
    #hud[data-skin] .sk-brand { flex: 1; min-width: 0; font-size: clamp(13px, 1.5vw, 19px); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #hud[data-skin] .sk-top .saldo { flex-direction: row; align-items: baseline; gap: 10px; }
    #hud[data-skin] .sk-top .saldo b { font-size: clamp(16px, 1.9vw, 22px); }
    #hud[data-skin] .sk-topbtns { display: flex; gap: 8px; }
    #hud[data-skin] .sk-side { position: absolute; right: 16px; top: calc(var(--gy) + 4px); width: 126px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
    #hud[data-skin][data-noside] .sk-side, #hud[data-skin][data-orient="portrait"] .sk-side { display: none; }
    #hud[data-skin] .sk-sbtn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font: 700 11px system-ui; letter-spacing: .14em; text-align: left; transition: transform .12s, background .2s, border-color .2s; }
    #hud[data-skin] .sk-sbtn i { font-style: normal; font-size: 16px; width: 20px; text-align: center; }
    #hud[data-skin] .sk-sbtn:hover { transform: translateX(-3px); }
    #hud[data-skin] .sk-sbtn.muted { opacity: .55; }
    #hud[data-skin] .sk-dock { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--dock-h) + env(safe-area-inset-bottom)); padding: 0 24px env(safe-area-inset-bottom);
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; z-index: 3; }
    #hud[data-skin] .sk-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
    #hud[data-skin] .sk-bets { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    #hud[data-skin] .sk-lbl { font: 600 10px system-ui; letter-spacing: .16em; opacity: .7; }
    #hud[data-skin] .sk-betrow { display: flex; align-items: center; gap: 8px; }
    #hud[data-skin] .betchips { display: flex; gap: 6px; }
    #hud[data-skin] .bchip { min-width: 50px; height: 46px; padding: 0 8px; font: 800 13px system-ui; transition: transform .12s, box-shadow .2s, background .2s; }
    #hud[data-skin] .bchip:hover:not(:disabled) { transform: translateY(-3px); }
    #hud[data-skin] .sk-spinwrap { position: relative; display: grid; place-items: center; }
    #hud[data-skin] .sk-ring { position: absolute; inset: -10px; border-radius: 50%; pointer-events: none; }
    #hud[data-skin] .spin { --spin-size: 108px; margin-top: -26px; }
    #hud[data-skin] .sk-right { display: flex; align-items: center; justify-content: flex-end; gap: 20px; }
    #hud[data-skin] .sk-right .apuesta { display: none; }
    #hud[data-skin] .sk-right .stat b { font-size: clamp(15px, 1.7vw, 20px); }
    #hud[data-skin] .autos { display: flex; gap: 6px; }
    #hud[data-skin] .buybox { left: calc(var(--gx) - var(--gw) / 2 - 16px); top: calc(var(--gy) + 20px); }
    #hud[data-skin] .banner { top: calc((var(--gy) + var(--gb)) / 2); }
    /* Menú e historial */
    .sk-menu h2 { margin-bottom: 14px; }
    .sk-mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .sk-mitem { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px; border-radius: 16px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); font: 700 13px system-ui; }
    .sk-mitem i { font-style: normal; font-size: 26px; }
    .sk-mitem:hover { border-color: var(--accent); }
    table.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.hist th, table.hist td { text-align: left; padding: 7px 6px; border-bottom: 1px solid rgba(255,255,255,.1); }
    table.hist tr.won td:last-child { color: var(--accent); font-weight: 700; }
    /* Partículas de premio */
    #hud .fx { position: absolute; left: var(--gx); top: calc((var(--gy) + var(--gb)) / 2); width: 0; height: 0; pointer-events: none; z-index: 4; }
    #hud .fx i { position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px; animation: fxfly 1.7s cubic-bezier(.15,.7,.3,1) var(--d) both; }
    @keyframes fxfly { 0% { transform: translate(0,0) scale(.2) rotate(0); opacity: 0; } 12% { opacity: 1; }
      70% { opacity: 1; } 100% { transform: translate(var(--dx), calc(var(--dy) + 160px)) scale(var(--s)) rotate(var(--r)); opacity: 0; } }

    /* Celular: dock en dos pisos (fichas arriba; apuesta · GIRAR · premio abajo) */
    #hud[data-skin][data-orient="portrait"] { --top-h: 60px; --dock-h: 224px; }
    #hud[data-skin][data-orient="portrait"] .sk-brand { display: none; }
    #hud[data-skin][data-orient="portrait"] .sk-top .saldo { margin-left: auto; }
    #hud[data-skin][data-orient="portrait"] .sk-top .saldo small { display: none; }
    /* Vista previa en celular: la etiqueta y FORZAR BONUS van debajo de la barra superior (no empujan el saldo) */
    #hud[data-skin][data-orient="portrait"] .sk-top > .tag, #hud[data-skin][data-orient="portrait"] .sk-top > .forcebtn { position: absolute; top: calc(var(--top-h) + env(safe-area-inset-top) + 8px); }
    #hud[data-skin][data-orient="portrait"] .sk-top > .tag { left: 14px; } #hud[data-skin][data-orient="portrait"] .sk-top > .forcebtn { right: 14px; }
    #hud[data-skin][data-orient="portrait"] .sk-top .tag { font-size: 9px; padding: 2px 5px; }

    #hud .banner { font-family: var(--bn-font, var(--font)); background-color: var(--bn-bg, rgba(0,0,0,.74)); border-color: var(--bn-border, var(--accent));

    #hud .fx[data-shape] i { animation-name: fxfly; border: 0; box-shadow: none; }

    #hud .fx[data-shape="confeti"] i:nth-child(3n) { background: var(--primary); } #hud .fx[data-shape="confeti"] i:nth-child(3n+1) { background: #fff; }

    #hud .fx[data-shape="estrellas"] i { width: 22px; height: 22px; margin: -11px; background: var(--accent); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
    #hud .fx[data-shape="burbujas"] i { width: 22px; height: 22px; margin: -11px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.7), transparent 60%); }
    #hud .fx[data-shape="gemas"] i { width: 18px; height: 18px; margin: -9px; background: linear-gradient(135deg, #7ef9ff, #2b8cff 60%, #0a2a6b); clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); }
    /* Presentación del bonus a pantalla completa (imagen, GIF o video) */

    .bonus-intro img, .bonus-intro video { position: static !important; max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; object-fit: contain; }
    .bonus-intro small { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font: 600 12px system-ui; opacity: .7; }

    /* ---- Pantalla de carga con la marca del juego (logo, fondo, color y estilo) ---- */
    #loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; background: var(--ld-bg, #05060c); background-size: cover; background-position: center;
      font: 600 15px system-ui; color: #fff; --ld-color: var(--accent); transition: opacity .35s; }
    #loader.out { opacity: 0; pointer-events: none; }
    #loader .ld { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 20px; }

<body>
  <div id="bg"></div>
  <div id="stage"></div>
  <div id="hud"></div>
  <div id="loader"><div class="ld"><div class="ld-logo" id="ldLogo"></div><div class="ld-tag" id="ldTag"></div><div id="loadText">Cargando…</div><div class="bar2"><i id="loadBar"></i></div></div></div>

  <script type="module">
    import { GameApi } from '/game-engines/shared/api.js';
    import { ENGINE_LOADERS } from '/game-engines/index.js';

    const loadText = document.getElementById('loadText');
    const loadBar = document.getElementById('loadBar');
    const loaderEl = document.getElementById('loader');
    const progress = (p, t) => { loadBar.style.width = `${Math.round(p * 100)}%`; loaderEl.style.setProperty('--p', String(Math.round(p * 100))); if (t) loadText.textContent = t; };

    /** Pantalla de carga con la marca: logo (imagen, GIF o video), fondo, color, frase y estilo. */
    function applyBrand(b) {
      if (!b) return 0;
      const st = loaderEl.style;
      if (b.bg) st.setProperty('--ld-bg', b.bg);
      if (b.bgImage) loaderEl.style.backgroundImage = `url("${String(b.bgImage).replace(/"/g, '%22')}")`;
      if (b.color) st.setProperty('--ld-color', b.color);
      loaderEl.dataset.style = b.loader || 'bar';
      const logo = document.getElementById('ldLogo');
      if (b.logo) {
        const isVid = /\.(mp4|webm)(\?|$)/i.test(b.logo);
        const el = document.createElement(isVid ? 'video' : 'img');
        if (isVid) Object.assign(el, { autoplay: true, muted: true, loop: true, playsInline: true }); else el.alt = b.name || '';
        el.src = b.logo;
        logo.replaceChildren(el);
      } else {
        const t = document.createElement('b'); t.textContent = b.name || ''; logo.replaceChildren(t);
      }
      document.getElementById('ldTag').textContent = b.tagline || '';
      loaderEl.classList.add('branded');
      return Number(b.minMs ?? 1500);
    }

    async function boot() {
      const gameId = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
      const q = new URLSearchParams(location.search);
      const api = q.get('token') ? new GameApi({ token: q.get('token') }) : await GameApi.demo(gameId);
      const session = await api.session();
      if (session.gameId !== gameId) throw new Error('La sesión no corresponde a este juego');
      const t0 = performance.now();
      const minMs = q.get('edit') === '1' ? 0 : applyBrand(session.brand);
      document.title = session.game.theme?.title || session.game.name;
      const bg = session.game.theme?.backgroundColor;
      if (bg) document.body.style.background = bg;
      progress(0.05, 'Cargando motor…');
      const Engine = await ENGINE_LOADERS[session.game.engine]();
      const engine = new Engine({
        container: document.getElementById('stage'), hudRoot: document.getElementById('hud'), api, session,
        lobbyUrl: q.get('lobby'),
      });
      await engine.init(progress);
      window.engine = engine; // útil para depurar desde la consola
      // Vista previa del borrador: el panel puede pedir ver un cartel o el bonus de ejemplo para diseñarlos
      if (session.source === 'draft') {
        window.addEventListener('message', async (e) => {
          const d = e.data || {};
          if (d.type !== 'demo' || e.source !== window.parent || !engine.hud || engine.busy) return;
          const bet = engine.hud.bet;
          engine.currentBet = bet;
          engine.busy = true;
          try {
            if (d.kind === 'win') await engine.presentTotal(bet * 5, bet);
            else if (d.kind === 'big') await engine.presentTotal(bet * 20, bet);
            else if (d.kind === 'mega') await engine.presentTotal(bet * 80, bet);
            else if (d.kind === 'status') { engine.hud.setStatus(engine.msg('spinOf', { i: 3, n: 10 })); setTimeout(() => engine.hud.setStatus(''), 3000); }
            else if (d.kind === 'feature') {
              await engine.featureIntro(engine.msg('freeSpins', { n: 10 }), 'BONUS');
              engine.hud.setStatus(engine.msg('spinOf', { i: 1, n: 10 }));
              await new Promise((r) => setTimeout(r, 1500));
              engine.hud.setStatus('');
              await engine.featureOutro(12.5);
            }
          } finally { engine.busy = false; }
        });
      }
      // El logo de la marca se ve al menos el tiempo configurado
      const left = minMs - (performance.now() - t0);
      if (left > 0) await new Promise((r) => setTimeout(r, left));
      loaderEl.classList.add('out');
      setTimeout(() => loaderEl.remove(), 400);
    }

    boot().catch((e) => {
      console.error(e);
      loadText.textContent = `No se pudo cargar el juego: ${e.message}`;
      loadBar.parentElement.remove();
    });
  </script>
</body>
</html>
