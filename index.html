<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casino Platform · Juegos</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #24163f, #07080f 70%); color: #eef; font: 15px/1.5 system-ui, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 22px clamp(16px, 4vw, 48px); }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 32px); }
    header a { color: #cbb8ff; text-decoration: none; font-size: 14px; }
    main { padding: 0 clamp(16px, 4vw, 48px) 48px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .game { background: #141a2b; border: 1px solid #2b3350; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
    .game:hover { transform: translateY(-3px); border-color: #8e7ff0; }
    .art { height: 150px; display: grid; place-items: center; background: linear-gradient(135deg, #2a1b4d, #0e1a3a); font-size: 52px; }
    .info { padding: 14px 16px; }
    .info b { display: block; font-size: 17px; }
    .info small { color: #9aa3c0; }
    .play { margin: 0 16px 16px; text-align: center; padding: 10px; border-radius: 12px; background: #6c5ce7; font-weight: 700; }
    footer { color: #7d86a5; font-size: 12px; padding: 0 clamp(16px, 4vw, 48px) 32px; }
  </style>
</head>
<body>
  <header><h1>🎰 Casino Platform</h1><a href="/admin">Panel de administración →</a></header>
  <main><div class="grid" id="games"><p>Cargando juegos…</p></div></main>
  <footer>Modo demo con créditos de prueba. Juega con responsabilidad. +18.</footer>
  <script type="module">
    const ICON = { 'reel-rush': '🍒', megaways: '🗿', 'bonus-buy': '🐉', 'hold-win': '🪙', 'colossal-reels': '⚔️',
      'cluster-pays': '💎', 'scatter-pays': '⚡', 'expanding-symbol': '📖', 'sticky-wilds': '🤠', 'megaways-cascade': '🌊', craps: '🎲' };
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    try {
      const games = await (await fetch('/api/v1/games')).json();
      document.getElementById('games').innerHTML = games.map((g) => `
        <a class="game" href="/play/${encodeURIComponent(g.id)}">
          <div class="art">${ICON[g.engine] || '🎰'}</div>
          <div class="info"><b>${esc(g.name)}</b><small>${esc(g.engine)} · RTP ${g.rtp ? (g.rtp * 100).toFixed(2) + ' %' : '—'} · volatilidad ${esc(g.volatility || '—')}</small></div>
          <div class="play">Jugar demo</div>
        </a>`).join('') || '<p>No hay juegos publicados.</p>';
    } catch (e) {
      document.getElementById('games').textContent = `Error cargando juegos: ${e.message}`;
    }
  </script>
</body>
</html>
