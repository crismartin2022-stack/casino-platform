<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d17" />
  <title>Slots</title>
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.mjs",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
    }
  }
  </script>
  <style>
    :root { --primary:#e94560; --accent:#ffd460; --panel:#16213e; --text:#fff; --font: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d17; color: var(--text); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    #stage { position: fixed; inset: 0 0 86px 0; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--font); color: var(--text); }
    #hud > * { pointer-events: auto; }
    #bg { position: fixed; inset: 0; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--primary) 25%, #000) 0%, #05060c 75%); }
    .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 14px 8px; }
    .title { flex: 1; font-size: clamp(16px, 2.6vw, 26px); letter-spacing: .04em; text-shadow: 0 2px 8px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { background: #ff9f1c; color: #000; font: 700 11px system-ui; padding: 4px 8px; border-radius: 6px; }
    .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: calc(86px + env(safe-area-inset-bottom)); padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      display: flex; align-items: center; gap: 10px; background: linear-gradient(to top, color-mix(in srgb, var(--panel) 96%, #000), color-mix(in srgb, var(--panel) 70%, transparent)); border-top: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); }
    .stat { display: flex; flex-direction: column; min-width: 0; }
    .stat small { font: 600 10px system-ui; opacity: .7; letter-spacing: .1em; }
    .stat b { font-size: clamp(13px, 1.8vw, 20px); white-space: nowrap; }
    .betbox { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    button { font-family: inherit; cursor: pointer; border: 0; color: inherit; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .chip { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); font-size: 18px; display: grid; place-items: center; text-decoration: none; color: var(--text); flex: none; }
    .chip.on { background: var(--accent); color: #000; }
    .spin { width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--primary) 60%, #fff), var(--primary) 60%, color-mix(in srgb, var(--primary) 60%, #000));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 70%, transparent), 0 6px 18px rgba(0,0,0,.6); font-size: 34px; flex: none; }
    .spin.busy span { display: inline-block; animation: rot .6s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }
    .buy { background: linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 60%, #000)); color: #000; font-weight: 800; padding: 10px 14px; border-radius: 12px; font-size: 13px; flex: none; }
    .banner { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); text-align: center; padding: 18px 34px; border-radius: 22px;
      background: rgba(0,0,0,.72); border: 3px solid var(--accent); box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 50%, transparent); animation: pop .35s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
    .banner small { display: block; font-size: clamp(14px, 2.4vw, 24px); letter-spacing: .1em; color: var(--accent); }
    .banner b { display: block; font-size: clamp(30px, 6vw, 68px); }
    .banner.big b { color: var(--accent); text-shadow: 0 0 18px var(--primary); }
    @keyframes pop { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } }
    .status { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 6px 14px; border-radius: 999px; font-size: clamp(12px, 1.6vw, 16px); white-space: nowrap; pointer-events: none; }
    .status:empty { display: none; }
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 16px; z-index: 10; }
    .modal[hidden], .banner[hidden] { display: none; }
    .sheet { position: relative; background: var(--panel); border: 2px solid var(--accent); border-radius: 18px; padding: 22px; max-width: 760px; width: 100%; max-height: 88vh; overflow: auto; font-family: system-ui, sans-serif; }
    .sheet h2 { font-family: var(--font); margin: 0 0 10px; color: var(--accent); }
    .sheet .close { position: absolute; top: 10px; right: 10px; }
    .paytable { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 14px 0; }
    .pay { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px; font-size: 13px; }
    .pay img { width: 56px; height: 56px; object-fit: contain; }
    .fine { font-size: 11px; opacity: .7; }
    .confirm { text-align: center; } .confirm .buy { font-size: 16px; padding: 12px 22px; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: #05060c; font: 600 15px system-ui; }
    #loader .bar { width: min(320px, 70vw); height: 8px; background: #222; border-radius: 99px; overflow: hidden; margin-top: 12px; }
    #loader .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    @media (max-width: 560px) { .stat small { font-size: 9px; } .chip { width: 34px; height: 34px; font-size: 15px; } .spin { width: 60px; height: 60px; } .buy { padding: 8px; font-size: 11px; } }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="stage"></div>
  <div id="hud"></div>
  <div id="loader"><div><div id="loadText">Cargando…</div><div class="bar"><i id="loadBar"></i></div></div></div>

  <script type="module">
    import { GameApi } from '/game-engines/shared/api.js';
    import { ENGINE_LOADERS } from '/game-engines/index.js';

    const loadText = document.getElementById('loadText');
    const loadBar = document.getElementById('loadBar');
    const progress = (p, t) => { loadBar.style.width = `${Math.round(p * 100)}%`; if (t) loadText.textContent = t; };

    async function boot() {
      const gameId = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
      const q = new URLSearchParams(location.search);
      const api = q.get('token') ? new GameApi({ token: q.get('token') }) : await GameApi.demo(gameId);
      const session = await api.session();
      if (session.gameId !== gameId) throw new Error('La sesión no corresponde a este juego');
      document.title = session.game.theme?.title || session.game.name;
      const bg = session.game.theme?.backgroundColor;
      if (bg) document.body.style.background = bg;
      progress(0.05, 'Cargando motor…');
      const Engine = await ENGINE_LOADERS[session.game.engine]();
      const engine = new Engine({
        container: document.getElementById('stage'), hudRoot: document.getElementById('hud'), api, session,
        lobbyUrl: q.get('lobby'),
      });
      await engine.init(progress);
      window.engine = engine; // útil para depurar desde la consola
      document.getElementById('loader').remove();
    }

    boot().catch((e) => {
      console.error(e);
      loadText.textContent = `No se pudo cargar el juego: ${e.message}`;
      loadBar.parentElement.remove();
    });
  </script>
</body>
</html>
